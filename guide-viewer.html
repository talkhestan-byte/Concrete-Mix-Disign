<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<title>راهنمای طرح اختلاط بتن</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #e5eaf1; font-family: Tahoma, Arial, sans-serif; direction: rtl; }
  header { position: sticky; top: 0; z-index: 10; background: #0078d4; color: white; padding: 12px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 5px #0003; }
  header strong { font-size: 15px; }
  button { border: 0; border-radius: 8px; padding: 10px 15px; background: white; color: #005a9e; font-weight: bold; cursor: pointer; font-family: inherit; }
  #viewer { padding: 10px; text-align: center; }
  .pdf-page { width: 100%; max-width: 800px; display: block; margin: 0 auto 15px auto; background: white; box-shadow: 0 3px 15px #0003; border-radius: 5px; }
  #error { color: #b91c1c; padding: 20px; text-align: center; font-weight: bold; display: none; }
</style>
</head>
<body>
<header>
  <strong>راهنمای طرح اختلاط بتن</strong>
  <button id="close">✕ بستن</button>
</header>
<div id="error">متأسفانه فایل راهنما بارگذاری نشد. لطفاً مطمئن شوید فایل guide.pdf در برنامه قرار دارد.</div>
<div id="viewer"></div>
<script>
document.getElementById('close').onclick = () => {
  if (window.parent !== window && typeof window.parent.closeGuideViewer === 'function') {
    window.parent.closeGuideViewer();
  } else {
    window.history.back();
  }
};

// در اینجا ما فایل PDF را به مرورگر پاس می‌دهیم تا مرورگر خودش آن را به صورت عکس در بیاورد
const viewer = document.getElementById('viewer');
const errorDiv = document.getElementById('error');

// این ترفند باعث می‌شود فایل PDF در WebView اندروید به جای دانلود، به صورت یک تصویر درون برنامه نمایش داده شود
const embed = document.createElement('embed');
embed.src = './guide.pdf#toolbar=0&navpanes=0&scrollbar=0';
embed.type = 'application/pdf';
embed.style.width = '100%';
embed.style.height = '100vh'; 
embed.style.border = 'none';

// اگر مرورگر نتوانست فایل را نمایش دهد، خطا نشان می‌دهد
embed.onerror = () => {
  errorDiv.style.display = 'block';
};

viewer.appendChild(embed);
</script>
</body>
</html>
