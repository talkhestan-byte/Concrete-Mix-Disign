<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<title>راهنمای طرح اختلاط بتن</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #e5eaf1; font-family: Tahoma, Arial, sans-serif; direction: rtl; }
  header { position: sticky; top: 0; z-index: 10; background: #0078d4; color: white; padding: 12px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 5px #0003; }
  header strong { font-size: 15px; }
  button { border: 0; border-radius: 8px; padding: 10px 15px; background: white; color: #005a9e; font-weight: bold; cursor: pointer; font-family: inherit; }
  #viewer { padding: 10px; text-align: center; overflow: auto; }
  .guide-img { width: 100%; max-width: 900px; display: block; margin: 0 auto; background: white; box-shadow: 0 3px 15px #0003; }
</style>
</head>
<body>
<header>
  <strong>راهنمای طرح اختلاط بتن</strong>
  <button id="close">✕ بستن</button>
</header>
<div id="viewer">
  <!-- نام فایل عکس شما اینجا قرار می‌گیرد -->
  <img src="./guide.jpg" class="guide-img" alt="راهنمای برنامه" onerror="this.style.display='none'; document.getElementById('err').style.display='block';">
  <div id="err" style="display:none; color:red; padding:20px; font-weight:bold;">عکس راهنما پیدا نشد. لطفاً مطمئن شوید فایل guide.jpg در ریشه برنامه قرار دارد.</div>
</div>
<script>
document.getElementById('close').onclick = () => {
  if (window.parent !== window && typeof window.parent.closeGuideViewer === 'function') {
    window.parent.closeGuideViewer();
  } else {
    window.history.back();
  }
};
</script>
</body>
</html>
