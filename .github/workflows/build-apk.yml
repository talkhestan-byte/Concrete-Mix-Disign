name: Build Iranian Concrete Mix Disign APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare web app
        run: |
          mkdir -p www
          cp index.html app.js style.css manifest.webmanifest sw.js www/
          
          # کپی کردن فایل راهنما
          cp guide.pdf www/
          cp guide-viewer.html www/
          
          npm init -y
          npm install @capacitor/core@6 @capacitor/android@6
          npm install --save-dev @capacitor/cli@6
          npm install @bcyesil/capacitor-plugin-printer@0.0.5
          npm install -D @capacitor/assets
          
          # نصب پکیج استاندارد PDF.js
          npm install pdfjs-dist@4.10.38

      - name: Configure Capacitor
        run: |
          npx cap init "Iranian Concrete Mix Design" com.iranianconcrete.mixdesign --web-dir www
          npx cap add android
          # سینک کردن فایل‌های وب با اندروید
          npx cap sync android

      # کپی فایل‌های PDF.js به داخل خروجی اندروید
      - name: Copy PDF.js to Android Assets
        run: |
          mkdir -p android/app/src/main/assets/public/pdfjs-dist/build
          cp node_modules/pdfjs-dist/build/pdf.mjs android/app/src/main/assets/public/pdfjs-dist/build/
          cp node_modules/pdfjs-dist/build/pdf.worker.mjs android/app/src/main/assets/public/pdfjs-dist/build/

      - name: Generate Android Icons
        run: npx capacitor-assets generate --android

      - name: Force Copy Icons (Fallback)
        run: |
          echo "در حال کپی اجباری عکس آیکون به پوشه‌های اندروید..."
          cp assets/icon-only.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp assets/icon-only.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          cp assets/icon-only.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
          cp assets/icon-only.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp assets/icon-only.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp assets/icon-only.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp assets/icon-only.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          echo "کپی اجباری با موفقیت انجام شد."

      - name: Verify Icons Generated
        run: |
          echo "بررسی فایل‌های آیکون در پوشه اندروید:"
          ls -la android/app/src/main/res/mipmap-xxxhdpi/

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Iranian Concrete Mix Disign-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
