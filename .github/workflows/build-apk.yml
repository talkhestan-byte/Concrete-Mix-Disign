
name: Build Iranian Concrete Mix Disign APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APk
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare web app
        run: |
          mkdir -p www
          cp index.html app.js style.css manifest.webmanifest sw.js www/
          cp icon-192.png icon-512.png www/
          npm init -y
          npm install @capacitor/core@6 @capacitor/android@6
          npm install --save-dev @capacitor/cli@6
          npm install @bcyesil/capacitor-plugin-printer@0.0.5
      - name: Configure Capacitor
        run: |
          npx cap init "Iranian Concrete Mix Design" com.iranianconcrete.mixdesign --web-dir www
          npx cap add android
          - name: Install Capacitor Assets
          run: npm install -D @capacitor/assets
          - name: Generate Android Icons
          run: npx capacitor-assets generate --android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Iranian Concrete Mix Disign-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
