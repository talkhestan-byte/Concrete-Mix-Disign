name: Build Beton479 APK

on:
workflow_dispatch:

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: '20'

  - name: Setup Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Install Android SDK
    uses: android-actions/setup-android@v3

  - name: Prepare web app
    run: |
      mkdir -p www
      cp index.html app.js style.css manifest.webmanifest sw.js www/
      cp icon-192.png icon-512.png www/
      npm init -y
      npm install @capacitor/core @capacitor/android
      npm install --save-dev @capacitor/cli

  - name: Configure Capacitor
    run: |
      npx cap init Beton479 org.beton479 --web-dir www
      npx cap add android
      npx cap sync android

  - name: Build APK
    run: |
      cd android
      chmod +x gradlew
      ./gradlew assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Beton479-APK
      path: android/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
