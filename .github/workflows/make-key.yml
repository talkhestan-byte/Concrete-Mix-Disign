name: Generate Key

on:
  workflow_dispatch:

jobs:
  make-key:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Keystore
        run: |
          keytool -genkeypair -v -keystore my-release-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias my-key-alias -storepass Kabab123! -keypass Kabab123! -dname "CN=IranianMix, OU=Dev, O=MyOrg, L=Tehran, S=Tehran, C=IR"

      - name: Print Base64
        run: |
          echo "=================== کد زیر را کپی کنید ==================="
          base64 -w0 my-release-key.jks
          echo ""
          echo "=========================================================="
