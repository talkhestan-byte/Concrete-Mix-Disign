name: Build and Sign APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare web app
        run: |
          mkdir -p www
          cp index.html app.js style.css manifest.webmanifest sw.js www/
          cp guide.jpg www/ || true
          cp guide-viewer.html www/
          
          npm init -y
          npm install @capacitor/core@6 @capacitor/android@6
          npm install --save-dev @capacitor/cli@6
          npm install @bcyesil/capacitor-plugin-printer@0.0.5
          npm install -D @capacitor/assets

      - name: Configure Capacitor
        run: |
          npx cap init "Iranian Concrete Mix Design" com.iranianconcrete.mixdesign --web-dir www
          npx cap add android
          npx cap sync android

      - name: Copy Assets to Android Public Folder
        run: |
          TARGET_DIR="android/app/src/main/assets/public"
          cp guide-viewer.html $TARGET_DIR/
          cp guide.jpg $TARGET_DIR/ || true

      - name: Generate Android Icons
        run: npx capacitor-assets generate --android

      - name: Force Copy Icons (Fallback)
        run: |
          cp assets/icon-only.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp assets/icon-only.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          cp assets/icon-only.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
          cp assets/icon-only.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp assets/icon-only.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp assets/icon-only.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp assets/icon-only.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png

      # --- مرحله ۱: ساخت keystore.properties ---
      - name: Create keystore.properties
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/my-release-key.jks
          cat > android/keystore.properties <<EOT
          storeFile=../my-release-key.jks
          storePassword=${{ secrets.RELEASE_STORE_PASSWORD }}
          keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}
          keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}
          EOT

      # --- مرحله ۲: تزریق تنظیمات امضا به build.gradle ---
      - name: Inject Signing Config into build.gradle
        run: |
          # این دستور تنظیمات امضا را به فایل build.gradle اضافه می‌کند
          sed -i 's/android {/android {\n    signingConfigs {\n        release {\n            storeFile file("my-release-key.jks")\n            storePassword "${{ secrets.RELEASE_STORE_PASSWORD }}"\n            keyAlias "${{ secrets.RELEASE_KEY_ALIAS }}"\n            keyPassword "${{ secrets.RELEASE_KEY_PASSWORD }}"\n        }\n    }\n    buildTypes {\n        release {\n            signingConfig signingConfigs.release\n        }\n    }/' android/app/build.gradle

      # --- مرحله ۳: ساخت نسخه Release با امضا ---
      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      # --- مرحله ۴: تغییر نام و آپلود ---
      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Iranian-Concrete-Mix-Design-Release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
