name: Build and Sign APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare web app
        run: |
          mkdir -p www
          cp index.html app.js style.css manifest.webmanifest sw.js www/
          cp guide.jpg www/ || true
          cp guide-viewer.html www/
          
          npm init -y
          npm install @capacitor/core@6 @capacitor/android@6
          npm install --save-dev @capacitor/cli@6
          npm install @bcyesil/capacitor-plugin-printer@0.0.5
          npm install -D @capacitor/assets

      - name: Configure Capacitor
        run: |
          npx cap init "Iranian Concrete Mix Design" com.iranianconcrete.mixdesign --web-dir www
          npx cap add android
          npx cap sync android

      - name: Copy Assets to Android Public Folder
        run: |
          TARGET_DIR="android/app/src/main/assets/public"
          cp guide-viewer.html $TARGET_DIR/
          cp guide.jpg $TARGET_DIR/ || true

      - name: Generate Android Icons
        run: npx capacitor-assets generate --android

      - name: Force Copy Icons (Fallback)
        run: |
          cp assets/icon-only.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp assets/icon-only.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          cp assets/icon-only.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
          cp assets/icon-only.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp assets/icon-only.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp assets/icon-only.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp assets/icon-only.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png

      # --- ۱. ساخت APK دیباگ ---
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # --- ۲. ساخت کلید استاندارد، تبدیل به Base64 و ذخیره در Secrets ---
      # این مرحله کلید را می‌سازد و اگر از قبل وجود داشته باشد، همان را استفاده می‌کند
      - name: Generate & Save Keystore
        id: keystore
        run: |
          KEYSTORE_FILE="my-release-key.jks"
          KEY_ALIAS="my-key-alias"
          STORE_PASS="Kabab123!"
          
          if [ ! -f "$KEYSTORE_FILE" ]; then
            keytool -genkeypair -v -keystore "$KEYSTORE_FILE" -keyalg RSA -keysize 2048 -validity 10000 -alias "$KEY_ALIAS" -storepass "$STORE_PASS" -keypass "$STORE_PASS" -dname "CN=IranianMix, OU=Dev, O=MyOrg, L=Tehran, S=Tehran, C=IR"
          fi
          
          BASE64_KEY=$(base64 -w0 "$KEYSTORE_FILE")
          echo "KEYSTORE_BASE64=$BASE64_KEY" >> $GITHUB_OUTPUT
          echo "RELEASE_KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_OUTPUT
          echo "RELEASE_STORE_PASSWORD=$STORE_PASS" >> $GITHUB_OUTPUT
          echo "RELEASE_KEY_PASSWORD=$STORE_PASS" >> $GITHUB_OUTPUT

      # --- ۳. استفاده از ابزار استاندارد برای امضا ---
      - name: Sign APK with apksigner
        run: |
          BUILD_TOOLS_PATH=$(find $ANDROID_HOME/build-tools -name "apksigner" -type f | head -n 1)
          
          $BUILD_TOOLS_PATH sign --ks my-release-key.jks \
            --ks-pass pass:Kabab123! \
            --key-pass pass:Kabab123! \
            --ks-key-alias my-key-alias \
            --out android/app/build/outputs/apk/debug/app-release-signed.apk \
            android/app/build/outputs/apk/debug/app-debug.apk

      # --- ۴. آپلود فایل نهایی ---
      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Iranian-Concrete-Mix-Design-Release
          path: android/app/build/outputs/apk/debug/app-release-signed.apk
          if-no-files-found: error
