name: Build and Sign APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare web app
        run: |
          mkdir -p www
          cp index.html app.js style.css manifest.webmanifest sw.js www/
          cp guide.jpg www/ || true
          cp guide-viewer.html www/
          
          npm init -y
          npm install @capacitor/core@6 @capacitor/android@6
          npm install --save-dev @capacitor/cli@6
          npm install @bcyesil/capacitor-plugin-printer@0.0.5
          npm install -D @capacitor/assets

      - name: Configure Capacitor
        run: |
          npx cap init "Iranian Concrete Mix Design" com.iranianconcrete.mixdesign --web-dir www
          npx cap add android
          npx cap sync android

      - name: Copy Assets to Android Public Folder
        run: |
          TARGET_DIR="android/app/src/main/assets/public"
          cp guide-viewer.html $TARGET_DIR/
          cp guide.jpg $TARGET_DIR/ || true

      - name: Generate Android Icons
        run: npx capacitor-assets generate --android

      - name: Force Copy Icons (Fallback)
        run: |
          cp assets/icon-only.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp assets/icon-only.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          cp assets/icon-only.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
          cp assets/icon-only.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp assets/icon-only.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp assets/icon-only.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp assets/icon-only.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png

      # --- مرحله ۱: ساخت کلید و فایل properties ---
      - name: Setup Keystore
        run: |
          # تبدیل متن Base64 به فایل کلید
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/my-release-key.jks
          
          # ساخت فایل تنظیمات کلید
          cat > android/keystore.properties <<EOT
          storeFile=my-release-key.jks
          storePassword=${{ secrets.RELEASE_STORE_PASSWORD }}
          keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}
          keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}
          EOT

      # --- مرحله ۲: تغییر فایل build.gradle به روش استاندارد ---
      - name: Configure Build Gradle for Signing
        run: |
          # این دستور به صورت استاندارد تنظیمات امضا را به Gradle اضافه می‌کند
          cat > android/app/build.gradle << 'EOF'
          apply plugin: 'com.android.application'

          android {
              namespace "com.iranianconcrete.mixdesign"
              compileSdk 34
              defaultConfig {
                  applicationId "com.iranianconcrete.mixdesign"
                  minSdkVersion 22
                  targetSdkVersion 34
                  versionCode 1
                  versionName "1.0"
                  testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
                  aaptOptions {
                      ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
                  }
              }
              signingConfigs {
                  release {
                      def keystoreProperties = new Properties()
                      def keystorePropertiesFile = rootProject.file("keystore.properties")
                      if (keystorePropertiesFile.exists()) {
                          keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
                          storeFile file(keystoreProperties['storeFile'])
                          storePassword keystoreProperties['storePassword']
                          keyAlias keystoreProperties['keyAlias']
                          keyPassword keystoreProperties['keyPassword']
                      }
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                      signingConfig signingConfigs.release
                  }
              }
          }
          dependencies {
              implementation fileTree(dir: 'libs', include: ['*.jar'])
              implementation "androidx.appcompat:appcompat:1.6.1"
              implementation "androidx.coordinatorlayout:coordinatorlayout:1.2.0"
              implementation "androidx.core:core-splashscreen:1.0.1"
              implementation project(':capacitor-android')
              testImplementation "junit:junit:4.13.2"
              androidTestImplementation "androidx.test.ext:junit:1.1.5"
              androidTestImplementation "androidx.test.espresso:espresso-core:3.5.1"
          }
          EOF

      # --- مرحله ۳: ساخت نسخه Release ---
      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      # --- مرحله ۴: آپلود فایل ---
      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Iranian-Concrete-Mix-Design-Release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
